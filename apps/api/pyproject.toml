[project]
name = "application-tracker-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "apscheduler>=3.11,<4",
  "cryptography>=44,<50",
  "httpx>=0.28,<1",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
